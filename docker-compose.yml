services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-emt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env (p. ej. openssl rand -hex 24)}
      POSTGRES_DB: ${POSTGRES_DB:-emt}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-emt} -d ${POSTGRES_DB:-emt}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Descomenta para acceder desde fuera del host (p. ej. notebooks de análisis):
    # ports:
    #   - "127.0.0.1:5432:5432"

  collector:
    build: .
    restart: unless-stopped
    env_file: .env
    # El collector construye DATABASE_URL a partir de POSTGRES_* (del .env) + este host,
    # salvo que DATABASE_URL esté definida en .env (p. ej. volúmenes con contraseña antigua).
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  pgdata:
